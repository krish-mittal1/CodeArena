services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api_postgres
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - SANDBOX_HOST_WORKDIR=${PWD}

  api_postgres:
    image: postgres:17-alpine
    container_name: api_postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krishisunique
      POSTGRES_DB: codexarena
    expose:
      - 5432
    volumes:
      - api-pg-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api_redis
    restart: unless-stopped
    expose:
      - 6379

volumes:
  api-pg-data:


networks:
  default:
    name: pangolin
    external: true
