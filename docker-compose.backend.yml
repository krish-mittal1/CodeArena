services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    expose:
      - 8000
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1

networks:
    default:
        name: pangolin
        external: true
