# Production-ish API stack.
#
# SECURITY — Docker socket:
#   The API mounts the host Docker socket so the judge can spawn isolated
#   runner containers (DinD-style). Whoever controls the API container
#   effectively has root on the host. Mitigations below:
#     - Do NOT bind-mount the full repo RW into the API container
#     - Sandbox I/O is confined to ./.sandbox_tmp (dedicated workdir)
#     - problems/ is mounted read-only when live problem packs are needed
#   Prefer a rootless Docker socket or a tightly scoped Docker-socket
#   proxy in hardened deployments.
services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    # Host port is configurable so multiple projects can share one server.
    # Set API_HOST_PORT in .env (default 8000). Prefer keeping this port
    # UNPUBLISHED (firewall it) and routing traffic via the pangolin network:
    # Pangolin resource target → http://api:8000 (Docker DNS on that network).
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Code is baked into the image via Dockerfile — no full-repo RW bind.
      - ./problems:/app/problems:ro
      # Dedicated sandbox workdir only (host path used in runner -v flags).
      - ./.sandbox_tmp:/app/.sandbox_tmp
      # Required for judging via host Docker. High privilege — see header.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api_postgres
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Host path that maps to /app inside the container for sandbox volume translation.
      # Must be the compose project directory so /app/.sandbox_tmp → ${PWD}/.sandbox_tmp.
      - SANDBOX_HOST_WORKDIR=${PWD}
      # Behind pangolin/caddy, rate limits must key on the real client IP from
      # X-Forwarded-For — otherwise every visitor shares the proxy's IP and one
      # actor exhausts OTP/login limits for everyone. The caddy container sits
      # on the same compose network, so its IP is the direct TCP peer.
      - TRUST_FORWARDED_HEADERS=${TRUST_FORWARDED_HEADERS:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.20.0.0/16}
    healthcheck:
      # Loopback inside the container — immune to multi-network hostname -i
      # returning multiple IPs (which broke busybox wget and flagged the
      # container unhealthy while the app was fine).
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s

  api_postgres:
    image: postgres:17-alpine
    container_name: api_postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
      POSTGRES_DB: ${POSTGRES_DB:-codexarena}
    expose:
      - 5432
    volumes:
      - api-pg-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api_redis
    restart: unless-stopped
    expose:
      - 6379

volumes:
  api-pg-data:


networks:
  default:
    name: pangolin
    external: true
