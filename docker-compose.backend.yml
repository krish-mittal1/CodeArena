services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    expose:
      - 8000
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1

  api_postgres:
      image: postgres:17-alpine
      container_name: api_postgres
      restart: unless-stopped
      environment:
          PGDATA: /var/lib/postgresql/data/pgdata
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codexarena
      expose:
          - 5432
      volumes:
          - api-pg-data:/var/lib/postgresql/data/pgdata
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 10s
          timeout: 5s
          retries: 5

volumes:
  api-pg-data:

networks:
    default:
        name: pangolin
        external: true
