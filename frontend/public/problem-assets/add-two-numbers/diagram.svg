<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Add two numbers linked list diagram">
  <rect width="560" height="160" fill="#1a1612"/>
  <text x="24" y="28" fill="#c6b49b" font-family="IBM Plex Mono, monospace" font-size="12">l1</text>
  <text x="24" y="78" fill="#c6b49b" font-family="IBM Plex Mono, monospace" font-size="12">l2</text>
  <text x="24" y="128" fill="#c6b49b" font-family="IBM Plex Mono, monospace" font-size="12">sum</text>
  <!-- l1: 2 -> 4 -> 3 -->
  <rect x="60" y="12" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="78" y="30" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">2</text>
  <path d="M96 26 H118" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="12" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="138" y="30" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">4</text>
  <path d="M156 26 H178" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="12" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="198" y="30" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">3</text>
  <text x="240" y="30" fill="#8d7965" font-family="IBM Plex Mono, monospace" font-size="12">= 342</text>
  <!-- l2: 5 -> 6 -> 4 -->
  <rect x="60" y="62" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="78" y="80" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">5</text>
  <path d="M96 76 H118" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="62" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="138" y="80" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">6</text>
  <path d="M156 76 H178" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="62" width="36" height="28" rx="4" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="198" y="80" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">4</text>
  <text x="240" y="80" fill="#8d7965" font-family="IBM Plex Mono, monospace" font-size="12">= 465</text>
  <!-- sum: 7 -> 0 -> 8 -->
  <rect x="60" y="112" width="36" height="28" rx="4" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="78" y="130" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">7</text>
  <path d="M96 126 H118" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="112" width="36" height="28" rx="4" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="138" y="130" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">0</text>
  <path d="M156 126 H178" stroke="#6c5a4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="112" width="36" height="28" rx="4" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="198" y="130" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">8</text>
  <text x="240" y="130" fill="#8d7965" font-family="IBM Plex Mono, monospace" font-size="12">= 807</text>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6c5a4b"/>
    </marker>
  </defs>
</svg>
