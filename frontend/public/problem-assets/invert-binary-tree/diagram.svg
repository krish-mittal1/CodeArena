<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Invert binary tree diagram">
  <rect width="560" height="220" fill="#1a1612"/>
  <text x="110" y="28" fill="#c6b49b" font-family="IBM Plex Mono, monospace" font-size="13">Input</text>
  <text x="390" y="28" fill="#c6b49b" font-family="IBM Plex Mono, monospace" font-size="13">Output</text>
  <!-- left tree -->
  <circle cx="120" cy="70" r="16" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="120" y="74" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">4</text>
  <line x1="120" y1="86" x2="70" y2="118" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="120" y1="86" x2="170" y2="118" stroke="#6c5a4b" stroke-width="2"/>
  <circle cx="70" cy="132" r="16" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="70" y="136" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">2</text>
  <circle cx="170" cy="132" r="16" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="170" y="136" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">7</text>
  <line x1="70" y1="148" x2="40" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="70" y1="148" x2="100" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="170" y1="148" x2="140" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="170" y1="148" x2="200" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <circle cx="40" cy="192" r="14" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="40" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">1</text>
  <circle cx="100" cy="192" r="14" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="100" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">3</text>
  <circle cx="140" cy="192" r="14" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">6</text>
  <circle cx="200" cy="192" r="14" fill="#342c25" stroke="#c96d3a" stroke-width="2"/>
  <text x="200" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">9</text>
  <!-- arrow -->
  <path d="M250 120 H300" stroke="#c96d3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c96d3a"/>
    </marker>
  </defs>
  <!-- right tree inverted -->
  <circle cx="420" cy="70" r="16" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="420" y="74" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">4</text>
  <line x1="420" y1="86" x2="370" y2="118" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="420" y1="86" x2="470" y2="118" stroke="#6c5a4b" stroke-width="2"/>
  <circle cx="370" cy="132" r="16" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="370" y="136" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">7</text>
  <circle cx="470" cy="132" r="16" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="470" y="136" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="13">2</text>
  <line x1="370" y1="148" x2="340" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="370" y1="148" x2="400" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="470" y1="148" x2="440" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <line x1="470" y1="148" x2="500" y2="178" stroke="#6c5a4b" stroke-width="2"/>
  <circle cx="340" cy="192" r="14" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="340" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">9</text>
  <circle cx="400" cy="192" r="14" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">6</text>
  <circle cx="440" cy="192" r="14" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="440" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">3</text>
  <circle cx="500" cy="192" r="14" fill="#342c25" stroke="#71945f" stroke-width="2"/>
  <text x="500" y="196" text-anchor="middle" fill="#f1e6d4" font-family="IBM Plex Mono, monospace" font-size="12">1</text>
</svg>
