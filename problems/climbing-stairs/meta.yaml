slug: climbing-stairs
title: Climbing Stairs
problem_type: dsa
difficulty: easy
rating: 800
description: |
  You are climbing a staircase. It takes n steps to reach the top.
  Each time you can either climb 1 or 2 steps. In how many distinct ways can you climb to the top?
input_format: |
  Line 1: integer n
output_format: |
  Integer number of distinct ways
time_limit_ms: 1500
memory_limit_mb: 256
is_active: true
constraints: |
  1 <= n <= 45
method_name: climbStairs
parameters:
  - name: n
    type: int
return_type: int
generator:
  count: 80
  seed: 8001
examples:
  - explanation: |
      There are two ways to climb to the top: 1+1 and 2.
  - explanation: |
      There are three ways: 1+1+1, 1+2, and 2+1.
