slug: coin-change-ii
title: Coin Change II
problem_type: dsa
difficulty: medium
rating: 1200
description: 'You are given an integer array coins representing coins of different denominations and an
  integer amount representing a total amount of money.

  Return the number of combinations that make up that amount. If that amount of money cannot be made up
  by any combination of the coins, return 0.

  You may assume that you have an infinite number of each kind of coin.

  The answer is guaranteed to fit into a signed 32-bit integer.'
input_format: 'Line 1: integer amount

  Line 2: JSON array coins'
output_format: Integer number of combinations
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '1 <= coins.length <= 300

  1 <= coins[i] <= 5000

  0 <= amount <= 5000'
method_name: change
parameters:
- name: amount
  type: int
- name: coins
  type: int[]
return_type: int
generator:
  count: 80
  seed: 21022
examples:
- explanation: 'There are 4 combinations that sum to 5: (1+1+1+1+1), (1+1+1+2), (1+2+2), (5).'
- explanation: No combination of coins sums to 3 using only 2s.
- explanation: 'One way: a single coin of value 10.'
