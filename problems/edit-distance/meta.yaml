slug: edit-distance
title: Edit Distance
problem_type: dsa
difficulty: hard
rating: 1450
description: 'Given two strings word1 and word2, return the minimum number of operations required to convert
  word1 to word2.

  You have the following three operations permitted on a word: Insert a character, Delete a character,
  Replace a character.'
input_format: 'Line 1: string word1

  Line 2: string word2'
output_format: Integer edit distance
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '0 <= word1.length, word2.length <= 500

  word1 and word2 consist of lowercase English letters.'
method_name: minDistance
parameters:
- name: word1
  type: str
- name: word2
  type: str
return_type: int
generator:
  count: 60
  seed: 21023
examples:
- explanation: horse → ros needs 3 operations (replace h→r, remove r, remove e).
- explanation: intention → execution needs 5 operations.
