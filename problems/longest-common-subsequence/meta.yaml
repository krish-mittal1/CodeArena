slug: longest-common-subsequence
title: Longest Common Subsequence
problem_type: dsa
difficulty: medium
rating: 1200
description: 'Given two strings text1 and text2, return the length of their longest common subsequence.
  If there is no common subsequence, return 0.

  A subsequence of a string is a new string generated from the original string with some characters (can
  be none) deleted without changing the relative order of the remaining characters.'
input_format: 'Line 1: string text1

  Line 2: string text2'
output_format: Integer LCS length
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '1 <= text1.length, text2.length <= 1000

  text1 and text2 consist of only lowercase English characters.'
method_name: longestCommonSubsequence
parameters:
- name: text1
  type: str
- name: text2
  type: str
return_type: int
generator:
  count: 80
  seed: 21003
examples:
- explanation: The LCS of "abcde" and "ace" is "ace" with length 3.
- explanation: The strings are identical, so LCS length is 3.
- explanation: The strings share no characters; LCS length is 0.
