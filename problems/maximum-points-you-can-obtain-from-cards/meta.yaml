slug: maximum-points-you-can-obtain-from-cards
title: Maximum Points You Can Obtain from Cards
problem_type: dsa
difficulty: medium
rating: 1200
description: 'You are given an integer array cardScore where each element represents
  points on a card. You must pick exactly k cards. In one move, you may pick only
  from the start or the end of the array.


  Return the maximum total points possible.


  Example 1

  Input: cardScore = [1, 2, 3, 4, 5, 6], k = 3

  Output: 15

  Explanation: Pick the last three cards -> 4 + 5 + 6 = 15.


  Example 2

  Input: cardScore = [5, 4, 1, 8, 7, 1, 3], k = 3

  Output: 12

  Explanation: Pick 5 (left), 4 (left), and 3 (right).'
input_format: 'Line 1: JSON array cardScore (int[])

  Line 2: integer k'
output_format: 'Single integer: maximum obtainable score'
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '1 <= cardScore.length <= 10^5

  -10^4 <= cardScore[i] <= 10^4

  0 <= k <= cardScore.length'
method_name: maxScore
parameters:
- name: cardScore
  type: int[]
- name: k
  type: int
return_type: int
generator:
  count: 120
  seed: 3688
