slug: minimum-window-substring
title: Minimum Window Substring
problem_type: dsa
difficulty: hard
rating: 1500
description: 'Given two strings s and t, return the smallest substring of s that contains
  every character from t, including duplicates. If no such substring exists, return
  an empty string.


  Example 1

  Input: s = "ADOBECODEBANC", t = "ABC"

  Output: "BANC"


  Example 2

  Input: s = "a", t = "a"

  Output: "a"'
input_format: 'Line 1: JSON string s

  Line 2: JSON string t'
output_format: 'JSON string: the minimum window in s containing all characters of
  t'
time_limit_ms: 2500
memory_limit_mb: 256
is_active: true
constraints: '1 <= s.length <= 10^5

  1 <= t.length <= 10^5

  s and t consist of English letters'
method_name: minWindow
parameters:
- name: s
  type: str
- name: t
  type: str
return_type: str
