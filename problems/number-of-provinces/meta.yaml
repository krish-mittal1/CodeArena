slug: number-of-provinces
title: Number of Provinces
problem_type: dsa
difficulty: medium
rating: 1100
description: 'There are n cities. Some of them are connected, while some are not. If city a is connected
  directly with city b, and city b is connected directly with city c, then city a is connected indirectly
  with city c.

  A province is a group of directly or indirectly connected cities and no other cities outside of the
  group.

  You are given an n x n matrix isConnected where isConnected[i][j] = 1 if the ith city and the jth city
  are directly connected, and isConnected[i][j] = 0 otherwise.

  Return the total number of provinces.'
input_format: 'Line 1: JSON 2D array isConnected'
output_format: Integer number of provinces
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '1 <= n <= 200

  n == isConnected.length

  n == isConnected[i].length

  isConnected[i][j] is 1 or 0

  isConnected[i][i] == 1

  isConnected[i][j] == isConnected[j][i]'
method_name: findCircleNum
parameters:
- name: isConnected
  type: int[][]
return_type: int
generator:
  count: 60
  seed: 21043
examples:
- explanation: Cities 0–1 are connected and city 2 is alone — 2 provinces.
- explanation: Three isolated cities — 3 provinces.
