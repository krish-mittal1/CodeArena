slug: pacific-atlantic-water-flow
title: Pacific Atlantic Water Flow
problem_type: dsa
difficulty: medium
rating: 1200
description: 'There is an m x n rectangular island that borders both the Pacific Ocean and Atlantic Ocean.

  The Pacific Ocean touches the island''s left and top edges, and the Atlantic Ocean touches the island''s
  right and bottom edges.

  The island is partitioned into a grid of square cells. You are given an m x n integer matrix heights
  where heights[r][c] represents the height above sea level of the cell at coordinate (r, c).

  The island receives a lot of rain, and the rain water can flow to neighboring cells directly north,
  south, east, and west if the neighboring cell''s height is less than or equal to the current cell''s
  height. Water can flow from any cell adjacent to an ocean into the ocean.

  Return a 2D list of grid coordinates result where result[i] = [ri, ci] denotes that rain water can flow
  from cell (ri, ci) to both the Pacific and Atlantic oceans.'
input_format: 'Line 1: JSON 2D array heights'
output_format: JSON 2D array of coordinates [r, c]
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: 'm == heights.length

  n == heights[r].length

  1 <= m, n <= 50

  0 <= heights[r][c] <= 10^5'
method_name: pacificAtlantic
parameters:
- name: heights
  type: int[][]
return_type: int[][]
generator:
  count: 50
  seed: 21012
examples:
- explanation: Cells listed can flow downhill (or equal height) to both the Pacific (top/left) and Atlantic
    (bottom/right).
- explanation: A single cell borders both oceans, so [[0,0]] is returned.
