description: 'Given two strings s1 and s2, return true if some permutation of s1 appears
  as a contiguous substring of s2. Otherwise return false.


  Example 1

  Input: s1 = "ab", s2 = "eidbaooo"

  Output: true


  Example 2

  Input: s1 = "ab", s2 = "eidboaoo"

  Output: false'
