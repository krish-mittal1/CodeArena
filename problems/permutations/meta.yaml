slug: permutations
title: Permutations
problem_type: dsa
difficulty: medium
rating: 1100
description: Given an array nums of distinct integers, return all the possible permutations. You can return
  the answer in any order.
input_format: 'Line 1: JSON array nums'
output_format: JSON 2D array of permutations
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: '1 <= nums.length <= 6

  -10 <= nums[i] <= 10

  All integers are unique.'
method_name: permute
parameters:
- name: nums
  type: int[]
return_type: int[][]
generator:
  count: 40
  seed: 21008
examples:
- explanation: All 6 permutations of [1,2,3] are returned (any order of the list is fine).
- explanation: All permutations of [0,1].
- explanation: A single element has one permutation.
