slug: rotting-oranges
title: Rotting Oranges
problem_type: dsa
difficulty: medium
rating: 1100
description: 'You are given an m x n grid where each cell can have one of three values:

  0 representing an empty cell, 1 representing a fresh orange, or 2 representing a rotten orange.

  Every minute, any fresh orange that is 4-directionally adjacent to a rotten orange becomes rotten.

  Return the minimum number of minutes that must elapse until no cell has a fresh orange. If this is impossible,
  return -1.

  '
input_format: 'Line 1: JSON 2D array grid

  '
output_format: 'Integer minutes, or -1

  '
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: 'm == grid.length

  n == grid[i].length

  1 <= m, n <= 10

  grid[i][j] is 0, 1, or 2

  '
method_name: orangesRotting
parameters:
- name: grid
  type: int[][]
return_type: int
generator:
  count: 80
  seed: 11002
examples:
- explanation: All fresh oranges become rotten in 4 minutes via BFS from initially rotten cells.
- explanation: A fresh orange is unreachable from any rotten orange, so return -1.
- explanation: No fresh oranges remain; return 0.
