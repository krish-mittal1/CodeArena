description: 'Given an integer array nums and an integer k, move a window of size
  k from left to right across the array and report the maximum value in each window.


  Return the list of window maximums in order.


  Example 1

  Input: nums = [1,3,-1,-3,5,3,6,7], k = 3

  Output: [3,3,5,5,6,7]


  Example 2

  Input: nums = [1], k = 1

  Output: [1]'
input_format: 'Line 1: JSON array nums (int[])

  Line 2: integer k'
output_format: 'JSON array of integers: maximum value for each contiguous window of
  size k'
