slug: surrounded-regions
title: Surrounded Regions
problem_type: dsa
difficulty: medium
rating: 1200
description: 'Given an m x n matrix board containing ''X'' and ''O'', capture all regions that are 4-directionally
  surrounded by ''X''.

  A region is captured by flipping all ''O''s into ''X''s in that surrounded region.

  Board is provided as an array of strings (each string a row). Return the board after capture as string[].'
input_format: 'Line 1: JSON array of strings board'
output_format: JSON array of strings board after capture
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: 'm == board.length

  n == board[i].length

  1 <= m, n <= 50

  board[i][j] is ''X'' or ''O'''
method_name: solve
parameters:
- name: board
  type: str[]
return_type: str[]
generator:
  count: 50
  seed: 21046
examples:
- explanation: Interior 'O's surrounded by 'X' are flipped; border-connected 'O's stay.
- explanation: A single 'X' board is unchanged.
