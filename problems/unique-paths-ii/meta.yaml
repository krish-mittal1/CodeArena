slug: unique-paths-ii
title: Unique Paths II
problem_type: dsa
difficulty: medium
rating: 1150
description: 'You are given an m x n integer array obstacleGrid. There is a robot
  initially located at the top-left corner (0, 0). The robot tries to move to the
  bottom-right corner. The robot can only move either down or right at any point in
  time.

  An obstacle and space are marked as 1 or 0 respectively in obstacleGrid. A path
  that the robot takes cannot include any square that is an obstacle.

  Return the number of possible unique paths that the robot can take to reach the
  bottom-right corner.'
input_format: 'Line 1: JSON 2D array obstacleGrid'
output_format: Integer number of paths
time_limit_ms: 2000
memory_limit_mb: 256
is_active: true
constraints: 'm == obstacleGrid.length

  n == obstacleGrid[i].length

  1 <= m, n <= 100

  obstacleGrid[i][j] is 0 or 1'
method_name: uniquePathsWithObstacles
parameters:
- name: obstacleGrid
  type: int[][]
return_type: int
generator:
  count: 80
  seed: 21020
